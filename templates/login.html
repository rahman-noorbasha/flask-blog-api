<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Flask Blog App</title>
    <style>
        /* Scale UI down 10% globally */
        :root { --ui-scale: 0.9; }
        @supports (zoom: .9) {
            body { zoom: .9; }
        }
        @supports not (zoom: .9) {
            body { transform: scale(var(--ui-scale)); transform-origin: top center; width: calc(100% / var(--ui-scale)); }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: 1;
        }

        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(20px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0 auto;
        }

        .login-wrapper {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(22px);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18),
                        0 0 120px rgba(102, 126, 234, 0.18);
            padding: 48px 36px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo {
            font-size: 44px;
            margin-bottom: 14px;
            animation: logoFloat 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .login-header h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #555;
            font-size: 15px;
            font-weight: 500;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d9d9dd;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.25s ease;
            background-color: #f8f9fb;
            color: #333;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        input::placeholder {
            color: #a5a5ae;
        }

        .login-btn {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 12px 26px rgba(102, 126, 234, 0.22);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(102, 126, 234, 0.28);
        }

        .alerts {
            margin-bottom: 0;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: alertSlide 0.4s ease-out;
        }

        @keyframes alertSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-danger {
            background-color: #fff1f1;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .alert-success {
            background-color: #f2fff2;
            color: #2a7f2a;
            border-left: 4px solid #2a7f2a;
        }

        .login-footer {
            text-align: center;
            margin-top: 10px;
            padding-top: 18px;
            border-top: 1px solid #e8e8ed;
        }

        .login-footer p {
            color: #555;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .register-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.25s ease;
            position: relative;
        }

        .register-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.25s ease;
        }

        .register-link:hover::after {
            width: 100%;
        }

        .register-link:hover {
            color: #4f55c5;
        }

        @media (max-width: 520px) {
            .login-wrapper {
                padding: 32px 22px;
            }

            .login-header h1 {
                font-size: 26px;
            }

            .logo {
                font-size: 38px;
            }

            input[type="text"],
            input[type="password"],
            .login-btn {
                padding: 12px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="login-header">
                <div class="logo">&#10024;</div>
                <h1>Welcome Back</h1>
                <p>Sign in to your Flask blog account</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alerts">
                        {% for category, message in messages %}
                            <div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account yet?</p>
                <p><a href="/register" class="register-link">Create your account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
