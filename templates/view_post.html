<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post[1] }}</title>
    {% include "_theme.html" %}
</head>
<body>
    <a href="{{ url_for('feed') }}">Back to Feed</a>
    <h1>{{ post[1] }}</h1>
    <p>{{ post[2] }}</p>

    {% if post[5] %}
        <p>
            Attachment:
            <a href="{{ url_for('static', filename='uploads/' + post[5]) }}" target="_blank">
                {{ post[5] }}
            </a>
        </p>
    {% endif %}
</body>
</html>
