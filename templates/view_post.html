<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    {% include "_theme.html" %}
</head>
<body>

    <a href="{{ url_for('feed') }}">Back to Feed</a>

    <h1>{{ post.title }}</h1>

    <p>{{ post.content }}</p>

    {% if post.attachment %}
        <p>
            Attachment:
            <a href="{{ url_for('static', filename='uploads/' + post.attachment) }}" target="_blank">
                {{ post.attachment }}
            </a>
        </p>
    {% endif %}

</body>
</html>
