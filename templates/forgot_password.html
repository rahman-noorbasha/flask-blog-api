<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Flask Blog App</title>
    <style>
        :root {
            --ui-scale: 0.9;
        }

        @supports (zoom: .9) {
            body {
                zoom: .9;
            }
        }

        @supports not (zoom: .9) {
            body {
                transform: scale(var(--ui-scale));
                transform-origin: top center;
                width: calc(100% / var(--ui-scale));
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes moveBackground {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(50px, 50px);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(20px);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            width: 100%;
            padding: 48px 36px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(22px);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18),
                0 0 120px rgba(102, 126, 234, 0.18);
            animation: slideUp 0.6s ease-out;
        }

        .auth-header {
            text-align: center;
        }

        .logo {
            display: inline-block;
            margin-bottom: 14px;
            font-size: 44px;
            color: #667eea;
            font-weight: 800;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-header p {
            color: #555;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d9d9dd;
            border-radius: 12px;
            font: inherit;
            font-size: 15px;
            color: #333;
            background: #f8f9fb;
            transition: all 0.25s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        input::placeholder {
            color: #a5a5ae;
        }

        .auth-btn {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 12px 26px rgba(102, 126, 234, 0.22);
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(102, 126, 234, 0.28);
        }

        .alerts {
            display: grid;
            gap: 10px;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-danger {
            background-color: #fff1f1;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .alert-success {
            background-color: #f2fff2;
            color: #2a7f2a;
            border-left: 4px solid #2a7f2a;
        }

        .auth-footer {
            text-align: center;
            padding-top: 18px;
            border-top: 1px solid #e8e8ed;
        }

        .auth-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            position: relative;
        }

        .auth-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.25s ease;
        }

        .auth-link:hover {
            color: #4f55c5;
        }

        .auth-link:hover::after {
            width: 100%;
        }

        @media (max-width: 520px) {
            .auth-card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                font-size: 38px;
            }

            input[type="email"],
            .auth-btn {
                padding: 12px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="auth-card">
            <div class="auth-header">
                <div class="logo">?</div>
                <h1>Forgot Password</h1>
                <p>Enter your email and generate a reset link for your account.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="alerts">
                {% for category, message in messages %}
                <div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autofocus>
                </div>

                <button type="submit" class="auth-btn">Generate Reset Link</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('login') }}" class="auth-link">Back to Login</a>
            </div>
        </section>
    </main>
</body>

</html>
