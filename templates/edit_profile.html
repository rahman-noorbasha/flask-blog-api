<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Flask Blog App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.14), transparent 18%),
                radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.16), transparent 20%);
            pointer-events: none;
            z-index: -1;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            max-width: 820px;
            margin: 0 auto;
            padding: 38px 22px 48px;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .page-title {
            color: white;
            font-size: 2.6rem;
            line-height: 1.1;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.88);
            margin-top: 10px;
            line-height: 1.7;
        }

        .nav-link,
        .save-btn {
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.92);
            color: #4338ca;
            border: 1px solid rgba(67, 56, 202, 0.16);
        }

        .nav-link:hover,
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(67, 56, 202, 0.16);
        }

        .profile-form-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 24px 55px rgba(15, 23, 42, 0.12);
            padding: 28px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #111827;
            font-weight: 800;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            font: inherit;
            color: #111827;
            background: #fff;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 26px;
        }

        .save-btn {
            padding: 0.85rem 1.25rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        @media (max-width: 620px) {
            .page-shell {
                padding: 28px 16px 36px;
            }

            .nav-link,
            .save-btn {
                width: 100%;
            }
        }
    </style>
    {% include "_theme.html" %}
</head>

<body>
    <main class="page-shell">
        <header class="page-header">
            <div>
                <h1 class="page-title">Edit Profile</h1>
                <p class="subtitle">Update your public bio and profile links.</p>
            </div>
            <a class="nav-link" href="{{ url_for('user_profile', username=current_user.username) }}">
                Back to Profile
            </a>
        </header>

        <section class="profile-form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="4">{{ user[4] or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="github">GitHub</label>
                    <input id="github" type="url" name="github" value="{{ user[5] or '' }}"
                        placeholder="https://github.com/username">
                </div>

                <div class="form-group">
                    <label for="linkedin">LinkedIn</label>
                    <input id="linkedin" type="url" name="linkedin" value="{{ user[6] or '' }}"
                        placeholder="https://linkedin.com/in/username">
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input id="location" type="text" name="location" value="{{ user[7] or '' }}"
                        placeholder="City, Country">
                </div>

                <div class="form-actions">
                    <button class="save-btn" type="submit">Save Profile</button>
                    <a class="nav-link" href="{{ url_for('user_profile', username=current_user.username) }}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
